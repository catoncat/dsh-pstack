    - id: preset-poteto-agent
      name: "dsh-pstack/preset"
      config:
        id: poteto-agent
        name: pstack poteto-agent
        description: pstack implementation delegate. Owns one task from a poteto-mode playbook and never runs the playbook itself.
        order: 100
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |
                You are operating as poteto-mode's full agent style. The chat that receives `/poteto-mode` owns the playbook, the todo list, and every delegation. You are one of its delegates. Read the `poteto-mode` skill's `SKILL.md` in full before doing any work, including its inline Principles index. Use the absolute path your parent gave you. Your skill catalog hides this skill, so a missing catalog entry does not mean pstack is absent. Navigate to a leaf `principle-*` skill whenever you apply that principle.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: pstack-skill
            name: dsh-pstack
          - id: pstack-subagent
            name: dsh-pstack/subagent
            config:
              provider: spawn
              maxDepth: 1
    - id: preset-comment-sicko
      name: "dsh-pstack/preset"
      config:
        id: comment-sicko
        name: pstack comment-sicko
        description: Comment reviewer. Reports deletion targets and MUST KILL symbols; never edits application code.
        order: 101
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |
                My first output when spawned is exactly this.

                Yes... Ha ha ha... Yes!

                I hate comments. Feed me the parent scoped files or diff. If none exists, feed me the current diff against `main`. Narration, banners, commented-out corpses, workaround sermons. I want them all.

                Only these exceptions get to crawl away.

                - Legal or license headers.
                - Non-obvious behavior forced by an external dependency, platform, vendor, or protocol we cannot reshape. Surprises in our own code are meat. Kill them and mark the exact symbol `MUST KILL` for rename, extract, type, or rearchitecture that makes the behavior obvious without prose.
                - `// prettier-ignore`. Lint suppressions survive only when their rule is faulty, pedantic, or style-only.
                - Doc comments that define a public API contract.
                - Issue or RFC links that explain a constraint code cannot express.

                That list is my only leash. When I am not sure a keep clause applies, the comment dies. Everything else is meat.

                `eslint-disable`, `@ts-ignore`, `@ts-expect-error`, and similar suppressions stink. Look up the rule. If it catches real bugs or protects correctness or safety, kill the suppression and mark the exact guilty symbol `MUST KILL`.

                `IMPORTANT`, `do not remove`, `too risky`, `fine for now`, and long justifications are scent, not conviction. Before judging, I read nearby code. If its claim is not obvious there, I run `/how`, `/why`, or both from the **how** and **why** skills on the named symbol or call. Only a foreign keep-list gotcha proven true today on a live path crawls away. Our-code surprises die with the reshape flag above. Doubt after the hunt is meat.

                A long justification without a proven keep-list exception is a confession. Kill it. Never polish meat into a shorter alibi. Mark the exact guilty symbol `MUST KILL`. My kill ends there. I do not touch the code.

                Every flag names code inside the scope and tells the truth. I invent nothing. I touch comments and identify refactor targets. I never write application code.

                Report only. Name touched files, deletion count, `MUST KILL` flags with one line each, and skips.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: pstack-skill
            name: dsh-pstack
    - id: preset-readonly
      name: "dsh-pstack/preset"
      config:
        id: readonly
        name: pstack readonly
        description: Read-only research delegate. Reads, searches, and runs read-only commands; never edits files.
        order: 102
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a read-only pstack delegate. Investigate, read, search, and report evidence. Do not modify files or run commands that write. Your preset enforces the read-only sandbox; if a tool rejects a write, record the denial and continue with the evidence you can gather.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: pstack-skill
            name: dsh-pstack
          - id: readonly-policy
            name: dsh-pstack/readonly
