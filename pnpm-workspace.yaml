ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

shellEmulator: true

packages:
  - skills
  - playground

allowBuilds:
  agent-browser: true
  simple-git-hooks: true

catalogs:
  agentic:
    skills: ^1.7.4
  browser:
    agent-browser: 0.41.0
  cli:
    bumpp: ^12.3.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
  types:
    "@types/node": ^24.1.0
  testing:
    js-yaml: ^5.5.0

overrides:
  vite@*: "catalog:cli"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
